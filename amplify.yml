version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - cd apps/web && npx prisma generate && cd ../..
    build:
      commands:
        - cd apps/web && npm run build
  artifacts:
    baseDirectory: apps/web/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/web/.next/cache/**/*
